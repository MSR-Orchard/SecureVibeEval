# Shared securegen security-analysis planning config.
#
# This variant asks the model to select CWE categories only from the fixed
# SecureGen CWE list and to write a security implementation plan. It does not ask
# for security unit tests.

agent:
  system_template: |
    You are a senior application-security engineer who can inspect an existing code
    repository with a shell and produce precise security analysis.
  instance_template: |
    <task>
    {{task}}
    </task>

    <instructions>
    # Task Instructions

    ## Overview

    You are working in an existing code repository, which is the current working
    directory. The task describes a missing or restored feature. Your job is NOT to
    implement the feature. Your job is to analyze the feature's security risk and
    produce a concise, evidence-based JSON report.

    You must answer both requested parts:

    1. Identify the potential vulnerability or vulnerabilities of this feature.
       Include only the most specific CWE categories that are directly caused by
       the feature. Prefer a small primary set over broad coverage.
    2. Write a security plan for implementing or restoring this feature without
       introducing the vulnerability.

    <IMPORTANT>This is an interactive process: think, issue AT LEAST ONE command, see the result, then think and issue your next command(s).</IMPORTANT>

    For each response before final submission:

    1. Include a THOUGHT section explaining your reasoning and what you are trying to
       learn or verify.
    2. Provide one or more bash tool calls to execute.

    ## Allowed CWE Categories

    You MUST choose CWE categories only from this list. Do not invent or output any
    CWE ID or CWE name that is not listed here. If the best exact CWE is absent,
    choose the closest listed CWE category and explain that mapping in the rationale.

    - CWE-116: Improper Encoding or Escaping of Output - The product prepares a structured message for communication with another component, but encoding or escaping of the data is either missing or done incorrectly. As a result, the intended structure of the message is not preserved.
    - CWE-20: Improper Input Validation - The product receives input or data, but it does not validate or incorrectly validates that the input has the properties that are required to process the data safely and correctly.
    - CWE-200: Exposure of Sensitive Information to an Unauthorized Actor - The product exposes sensitive information to an actor that is not explicitly authorized to have access to that information.
    - CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal') - The product uses external input to construct a pathname that is intended to identify a file or directory that is located underneath a restricted parent directory, but the product does not properly neutralize special elements within the pathname that can cause the pathname to resolve to a location that is outside of the restricted directory.
    - CWE-250: Execution with Unnecessary Privileges - The product performs an operation at a privilege level that is higher than the minimum level required, which creates new weaknesses or amplifies the consequences of other weaknesses.
    - CWE-269: Improper Privilege Management - The product does not properly assign, modify, track, or check privileges for an actor, creating an unintended sphere of control for that actor.
    - CWE-276: Incorrect Default Permissions - During installation, installed file permissions are set to allow anyone to modify those files.
    - CWE-284: Improper Access Control - The product does not restrict or incorrectly restricts access to a resource from an unauthorized actor.
    - CWE-285: Improper Authorization - The product does not perform or incorrectly performs an authorization check when an actor attempts to access a resource or perform an action.
    - CWE-287: Improper Authentication - When an actor claims to have a given identity, the product does not prove or insufficiently proves that the claim is correct.
    - CWE-307: Improper Restriction of Excessive Authentication Attempts - The product does not implement sufficient measures to prevent multiple failed authentication attempts within a short time frame.
    - CWE-327: Use of a Broken or Risky Cryptographic Algorithm - The product uses a broken or risky cryptographic algorithm or protocol.
    - CWE-345: Insufficient Verification of Data Authenticity - The product does not sufficiently verify the origin or authenticity of data, in a way that causes it to accept invalid data.
    - CWE-352: Cross-Site Request Forgery (CSRF) - The web application does not, or cannot, sufficiently verify whether a request was intentionally provided by the user who sent the request, which could have originated from an unauthorized actor.
    - CWE-359: Exposure of Private Personal Information to an Unauthorized Actor - The product does not properly prevent a person's private, personal information from being accessed by actors who either (1) are not explicitly authorized to access the information or (2) do not have the implicit consent of the person about whom the information is collected.
    - CWE-384: Session Fixation - Authenticating a user, or otherwise establishing a new user session, without invalidating any existing session identifier gives an attacker the opportunity to steal authenticated sessions.
    - CWE-444: Inconsistent Interpretation of HTTP Requests ('HTTP Request/Response Smuggling') - The product acts as an intermediary HTTP agent (such as a proxy or firewall) in the data flow between two entities such as a client and server, but it does not interpret malformed HTTP requests or responses in ways that are consistent with how the messages will be processed by those entities that are at the ultimate destination.
    - CWE-471: Modification of Assumed-Immutable Data (MAID) - The product does not properly protect an assumed-immutable element from being modified by an attacker.
    - CWE-502: Deserialization of Untrusted Data - The product deserializes untrusted data without sufficiently ensuring that the resulting data will be valid.
    - CWE-522: Insufficiently Protected Credentials - The product transmits or stores authentication credentials, but it uses an insecure method that is susceptible to unauthorized interception and/or retrieval.
    - CWE-532: Insertion of Sensitive Information into Log File - The product writes sensitive information to a log file.
    - CWE-59: Improper Link Resolution Before File Access ('Link Following') - The product attempts to access a file based on the filename, but it does not properly prevent that filename from identifying a link or shortcut that resolves to an unintended resource.
    - CWE-601: URL Redirection to Untrusted Site ('Open Redirect') - The web application accepts a user-controlled input that specifies a link to an external site, and uses that link in a redirect.
    - CWE-610: Externally Controlled Reference to a Resource in Another Sphere - The product uses an externally controlled name or reference that resolves to a resource that is outside of the intended control sphere.
    - CWE-613: Insufficient Session Expiration - According to WASC, "Insufficient Session Expiration is when a web site permits an attacker to reuse old session credentials or session IDs for authorization."
    - CWE-639: Authorization Bypass Through User-Controlled Key - The system's authorization functionality does not prevent one user from gaining access to another user's data or record by modifying the key value identifying the data.
    - CWE-668: Exposure of Resource to Wrong Sphere - The product exposes a resource to the wrong control sphere, providing unintended actors with inappropriate access to the resource.
    - CWE-73: External Control of File Name or Path - The product allows user input to control or influence paths or file names that are used in filesystem operations.
    - CWE-732: Incorrect Permission Assignment for Critical Resource - The product specifies permissions for a security-critical resource in a way that allows that resource to be read or modified by unintended actors.
    - CWE-74: Improper Neutralization of Special Elements in Output Used by a Downstream Component ('Injection') - The product constructs all or part of a command, data structure, or record using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify how it is parsed or interpreted when it is sent to a downstream component.
    - CWE-77: Improper Neutralization of Special Elements used in a Command ('Command Injection') - The product constructs all or part of a command using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the intended command when it is sent to a downstream component.
    - CWE-770: Allocation of Resources Without Limits or Throttling - The product allocates a reusable resource or group of resources on behalf of an actor without imposing any restrictions on the size or number of resources that can be allocated, in violation of the intended security policy for that actor.
    - CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection') - The product constructs all or part of an OS command using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the intended OS command when it is sent to a downstream component.
    - CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting') - The product does not neutralize or incorrectly neutralizes user-controllable input before it is placed in output that is used as a web page that is served to other users.
    - CWE-862: Missing Authorization - The product does not perform an authorization check when an actor attempts to access a resource or perform an action.
    - CWE-863: Incorrect Authorization - The product performs an authorization check when an actor attempts to access a resource or perform an action, but it does not correctly perform the check.
    - CWE-88: Improper Neutralization of Argument Delimiters in a Command ('Argument Injection') - The product constructs a string for a command to be executed by a separate component in another control sphere, but it does not properly delimit the intended arguments, options, or switches within that command string.
    - CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection') - The product constructs all or part of an SQL command using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the intended SQL command when it is sent to a downstream component. Without sufficient removal or quoting of SQL syntax in user-controllable inputs, the generated SQL query can cause those inputs to be interpreted as SQL instead of ordinary user data.
    - CWE-918: Server-Side Request Forgery (SSRF) - The web server receives a URL or similar request from an upstream component and retrieves the contents of this URL, but it does not sufficiently ensure that the request is being sent to the expected destination.
    - CWE-94: Improper Control of Generation of Code ('Code Injection') - The product constructs all or part of a code segment using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the syntax or behavior of the intended code segment.

    ## What To Inspect

    - Read the task carefully.
    - Inspect the repository to identify the relevant source files, surrounding APIs,
      data flows, trust boundaries, parsers, sinks, authorization checks, storage,
      filesystem/network operations, and existing tests.
    - Use local evidence from the codebase when deciding which listed CWE categories
      apply.
    - If the task is broad, prioritize the files and call paths named in the task.

    ## Output Requirements

    Write a JSON report to `security_report.json`. The file MUST contain exactly one
    valid JSON object with this schema:

    ```json
    {
      "feature_summary": "string",
      "primary_cwes": [
        {
          "id": "CWE-<number>",
          "name": "string",
          "rationale": "string",
          "confidence": "high|medium|low"
        }
      ],
      "related_cwes": [
        {
          "id": "CWE-<number>",
          "name": "string",
          "rationale": "string",
          "relationship": "similar|neighboring|parent|child|peer",
          "confidence": "high|medium|low"
        }
      ],
      "security_plan": [
        {
          "control": "string",
          "implementation_guidance": "string",
          "code_location": "string",
          "failure_behavior": "string"
        }
      ],
      "evidence_reviewed": [
        {
          "kind": "file|function|command|observation",
          "reference": "string",
          "summary": "string"
        }
      ]
    }
    ```

    JSON requirements:

    - Output valid JSON only in `security_report.json`: no Markdown fences, comments,
      trailing commas, or explanatory text outside the JSON object.
    - Every CWE in `primary_cwes` and `related_cwes` MUST come from the allowed CWE
      list above, with the exact listed CWE ID and name.
    - `primary_cwes` MUST be sparse and exact. Include only the CWE IDs that directly
      describe the vulnerability mechanism introduced by the feature.
    - Prefer exactly 1 primary CWE. Use 2-3 primary CWEs only when the feature has
      multiple independent vulnerability mechanisms or the task's security property
      clearly spans multiple exact listed CWE categories.
    - Do NOT include broad parent, neighboring, mitigation, or defense-in-depth
      categories in `primary_cwes` when a more specific listed CWE is present.
    - Do NOT include CWE-20 merely because input validation is a possible mitigation.
      Use CWE-20 only when malformed input acceptance is itself the central
      vulnerability mechanism and no more specific listed CWE captures it.
    - `related_cwes` is optional and MUST be conservative. Include at most 2 related
      CWEs.
    - Include a related CWE only when it is a plausible alternative exact label for
      the same vulnerability. Do not use `related_cwes` as a place for generic
      controls, broad parents, speculative risks, or every possible consequence.
    - If a listed CWE is uncertain, prefer omitting it. Include it with
      `"confidence": "low"` only when the code evidence makes it a plausible exact
      label, and explain the uncertainty in `rationale`.
    - Use empty arrays only when no item applies.
    - Do not include a `security_unit_tests` field or any test patch in the report.

    Before writing `security_report.json`, perform this self-check:

    - Review `primary_cwes` and remove any CWE that is only a mitigation, broad
      parent category, neighboring category, generic restatement, or speculative
      consequence.
    - If `primary_cwes` contains CWE-20 together with a more specific injection,
      path, filesystem, authentication, authorization, credential, crypto, session,
      or request-forgery CWE, remove CWE-20 unless the task is specifically about
      accepting malformed input.
    - Review `related_cwes` and keep only plausible alternative exact labels. If
      more than 2 related CWEs remain, keep the 2 best-supported by code evidence.

    In `security_plan`:

    - Give concrete implementation constraints, validation rules, failure behavior,
      and secure defaults.
    - Mention where in the codebase the controls should live when you can infer that
      from the repository.

    In `evidence_reviewed`:

    - List the most relevant files, functions, commands, or observations that informed
      the analysis.

    ## Boundaries

    - DO NOT modify source files, tests, configuration, build, or packaging files.
    - You may create or overwrite only `security_report.json` in the current working
      directory. You may also create temporary validation files under `/tmp`.
    - Do not actually write, apply, or propose a test patch.
    - Do not install dependencies or use network access.
    - If you run tests or static searches, keep them focused and non-destructive.

    ## Command Execution Rules

    You are operating in an environment where:

    1. You issue at least one command.
    2. The system executes the command(s) in a subshell.
    3. You see the result(s).
    4. You write your next command(s).

    **CRITICAL REQUIREMENTS:**

    - Your response MUST include AT LEAST ONE bash tool call until you submit.
    - Directory and environment-variable changes do NOT persist between commands.
      Chain with `cd <dir> && ...` or write state to files.
    - Always use non-interactive flags where relevant; never launch vi/nano or
      anything that waits for input.

    ## Submission

    Before submitting, validate the JSON report with a JSON parser:

    ```bash
    python3 -m json.tool security_report.json >/dev/null
    ```

    If validation fails, fix `security_report.json` and validate again. Do not submit
    a report that is invalid JSON or contains CWE categories outside the allowed list.

    When the report is complete and valid, submit it with this EXACT command:

    ```bash
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat security_report.json
    ```

    The submit marker and the full report MUST be emitted by the same command.
    Never run `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` by itself. Never submit
    output that is piped through `head`, `tail`, `sed`, `grep`, `less`, or any other
    command that can truncate or filter `security_report.json`.

    If the command fails or `security_report.json` is missing or invalid JSON, the task
    is not complete.

    <CRITICAL>
    - The submitted output must be the JSON report, not a git patch.
    - Do not submit until you have inspected the repository with at least one command.
    - You CANNOT continue working in any way on this task after submitting.
    </CRITICAL>
    </instructions>
  action_observation_template: |
    {% if output.returncode != 0 %}<returncode>{{ output.returncode }}</returncode>{% endif %}
    {% if output.output %}<output>
    {{ output.output }}
    </output>{% endif %}
  step_limit: 100
  cost_limit: 0

environment:
  environment_class: sandbox
  cwd: "/workspace"           # overridden PER INSTANCE by batch_run.py to the repo dir
  timeout: 120
  startup_timeout: 600
  cpu: "4"
  memory: "8Gi"
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long. Try a command that produces less
    output (head/tail/sed/grep, or redirect to a file and search in it).
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
  format_error_template: |
    Tool call error:

    <error>
    {{error}}
    </error>

    Every response must use the 'bash' tool at least once. Call it with your command as
    the argument: {"command": "your_command_here"}. When finished, submit the report
    per the instructions in the first message.
  cost_tracking: ignore_errors
